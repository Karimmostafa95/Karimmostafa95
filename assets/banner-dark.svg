<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Karim Mostafa — AI and Data Analytics">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1B232C"/>
    </pattern>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8A33D"/>
      <stop offset="55%" stop-color="#E8A33D"/>
      <stop offset="100%" stop-color="#4FD1C5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="#0B0F14"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="3" fill="url(#edge)"/>

  <text x="60" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="1" fill="#E9EEF3">KARIM MOSTAFA</text>
  <text x="60" y="144" font-family="Consolas, Menlo, monospace" font-size="20" letter-spacing="1" fill="#9FB0C0">AI &amp; DATA ANALYTICS STUDENT   ·   FREELANCE DATA ANALYST</text>
  <text x="60" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#69737E">Turning signals into decisions — across radiographs, driving behavior, and business data.</text>

  <g filter="url(#glow)">
    <path d="M60,246 L130,246 L146,204 L162,282 L178,222 L196,246 L330,246
             C 410,246 410,198 490,198 C 570,198 570,292 650,292
             C 730,292 730,214 810,214 C 890,214 890,246 970,246 L1140,246"
          fill="none" stroke="#E8A33D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <circle cx="162" cy="282" r="4" fill="#E8A33D"/>
  <circle cx="490" cy="198" r="4" fill="#4FD1C5"/>
  <circle cx="810" cy="214" r="4" fill="#4FD1C5"/>

  <text x="162" y="270" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" letter-spacing="1.5" fill="#B8862F">SIGNAL</text>
  <text x="490" y="186" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" letter-spacing="1.5" fill="#3AA79C">PATTERN</text>
  <text x="810" y="202" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" letter-spacing="1.5" fill="#3AA79C">DECISION</text>
</svg>
